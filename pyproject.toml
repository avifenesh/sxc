[project]
name = "sxc"
version = "0.0.1"
description = "Local corpus retrieval over your own text: BM25 + SPLADE v3 + ColBERTv2, with synthetic eval and an optional relevance judge"
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pyarrow>=15",
  "pandas>=2.2",
  "tqdm>=4.66",
  "orjson>=3.10",
  "tiktoken>=0.7",
  "anthropic>=0.40",
  "boto3>=1.34",
  "python-dotenv>=1.0",
  "pydantic>=2.7",
]

[project.optional-dependencies]
index = [
  "torch>=2.3",
  "transformers>=4.44",
  "ragatouille>=0.0.9",
  "pyserini>=0.36",
  "hnswlib>=0.8",
  "sentence-transformers>=3.0",
]
dev = [
  "pytest>=8",
  "ruff>=0.5",
  "mypy>=1.10",
  "ipython",
  "rich",
  "types-tqdm",
  "pandas-stubs",
  "pyarrow-stubs",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ANN", "RUF", "SIM"]
# ANN401: Any is allowed at JSON-parse boundaries.
# Quoted-type rules conflict with mypy needing real types — keep them off.
ignore = ["ANN401"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
warn_redundant_casts = true
disallow_any_unimported = true
disallow_any_generics = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
  "pyarrow", "pyarrow.*",
  "tqdm", "tqdm.*",
  "ragatouille", "ragatouille.*",
  "pyserini", "pyserini.*",
  "hnswlib",
  "colbert", "colbert.*",
  "faiss", "faiss.*",
]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["sxc", "sxc.chunk", "sxc.synth", "sxc.index", "sxc.bench", "sxc.serve"]
include-package-data = true

[tool.setuptools.package-data]
"sxc.synth" = ["prompt.md"]
